server.port=8080

# H2 luu file vao thu muc ./data (tat app du lieu van con)
spring.datasource.url=jdbc:h2:file:./data/qlsv
spring.datasource.username=sa
spring.datasource.password=
# Xem bang truc tiep: http://localhost:8080/h2-console (JDBC URL o tren)
spring.h2.console.enabled=true

# Tu tao/sua bang theo Entity
spring.jpa.hibernate.ddl-auto=update
# In cau SQL ra console de thay Repository chay gi
spring.jpa.show-sql=true

